<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Events</title>
    <style>
        :root {
            --bg-color: #FAFAFA;
            --card-bg: #FFFFFF;
            --text-main: #2C2C2C;
            --text-muted: #888888;
            --accent: #B8D6CD; /* Soft sage/teal accent */
            --urgency: #E5B299; /* Soft warm tone for imminent dates */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
        }

        h3 {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .event-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.04);
            transition: transform 0.2s ease;
        }

        .event-card:hover {
            transform: translateY(-2px);
        }

        .event-info {
            display: flex;
            flex-direction: column;
        }

        .event-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .event-date {
            font-size: 12px;
            color: var(--text-muted);
        }

        .countdown-badge {
            background-color: var(--accent);
            color: #2C2C2C;
            font-size: 12px;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .urgent {
            background-color: var(--urgency);
        }
    </style>
</head>
<body>

    <div class="container">
        <h3>Upcoming Focus</h3>
        
        <div class="event-card">
            <div class="event-info">
                <span class="event-title">Project Deadline</span>
                <span class="event-date">Oct 12, 2026</span>
            </div>
            <div class="countdown-badge urgent">In 2 days</div>
        </div>

        <div class="event-card">
            <div class="event-info">
                <span class="event-title">Flight to Istanbul</span>
                <span class="event-date">Oct 25, 2026</span>
            </div>
            <div class="countdown-badge">In 15 days</div>
        </div>
    </div>

</body>
</html>
