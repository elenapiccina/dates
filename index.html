        <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Focus & Dates</title>
    <!-- Alice Font -->
    <link href="https://fonts.googleapis.com/css2?family=Alice&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-main: #2D2623;
            --text-muted: #8C807B;
            --card-bg: #FAF6F0; /* Cream */
            --card-border: #EFE7DE;
            
            /* Glass Badge Tiers */
            --badge-future: rgba(240, 235, 228, 0.9);
            --badge-week: rgba(215, 232, 222, 0.9);
            --badge-soon: rgba(250, 230, 205, 0.9);
            --badge-urgent: rgba(248, 212, 218, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Alice', Georgia, serif;
            font-weight: 400;
            background-color: transparent;
            color: var(--text-main);
            padding: 32px 0 0 0; /* Clears Notion's top overlay bar entirely */
            margin: 0;
            width: 100%;
        }

        .container {
            width: 100%;
            padding: 0;
            margin: 0;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            padding-right: 120px; /* Safe distance so Notion's top-right buttons never block "+ Add" */
        }

        h3 {
            font-family: 'Alice', Georgia, serif;
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 0;
        }

        .btn-add {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 2px 10px;
            border-radius: 10px;
            font-family: 'Alice', Georgia, serif;
            font-size: 0.72rem;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            z-index: 10;
        }

        .btn-add:hover {
            background: #ffffff;
            border-color: #DDD4C8;
        }

        /* Compact Form Controls */
        .event-form {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 6px 10px;
            margin-bottom: 6px;
            display: none;
            grid-template-columns: 2fr 1.2fr auto;
            gap: 6px;
            align-items: center;
        }

        .event-form.active {
            display: grid;
        }

        .event-form input {
            padding: 3px 6px;
            border: 1px solid var(--card-border);
            border-radius: 5px;
            font-family: 'Alice', Georgia, serif;
            font-size: 0.8rem;
            outline: none;
            background: #ffffff;
            color: var(--text-main);
        }

        .event-form button {
            padding: 3px 8px;
            background: #E58CA3;
            border: none;
            border-radius: 5px;
            font-family: 'Alice', Georgia, serif;
            font-size: 0.75rem;
            color: white;
            cursor: pointer;
        }

        /* Tighter Card List */
        .events-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .event-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 5px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--card-border);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
            cursor: grab;
            transition: transform 0.15s ease;
        }

        .event-card:hover {
            transform: translateY(-1px);
        }

        .event-card.dragging {
            opacity: 0.35;
        }

        .event-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-grow: 1;
        }

        .drag-handle {
            color: rgba(180, 168, 160, 0.6);
            font-size: 10px;
            letter-spacing: -1px;
            cursor: grab;
        }

        .event-text-group {
            display: flex;
            flex-direction: column;
            gap: 1px;
            flex-grow: 1;
        }

        /* Editable Title Input */
        .title-input {
            font-family: 'Alice', Georgia, serif;
            font-size: 0.88rem;
            font-weight: 400;
            color: var(--text-main);
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            padding: 0;
            margin: 0;
            user-select: text;
        }

        .title-input:focus {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 3px;
        }

        /* Formatted Date Display with Overlay Date Picker */
        .event-date-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            width: fit-content;
        }

        .event-date-display {
            font-family: 'Alice', Georgia, serif;
            font-size: 0.76rem;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 0.01em;
            pointer-events: none;
        }

        .event-date-picker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            border: none;
            background: transparent;
        }

        .event-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Glass Badges */
        .countdown-badge {
            font-family: 'Alice', Georgia, serif;
            font-size: 0.7rem;
            font-weight: 400;
            padding: 1px 7px;
            border-radius: 8px;
            white-space: nowrap;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .badge-tier-future { background-color: var(--badge-future); }
        .badge-tier-week   { background-color: var(--badge-week); }
        .badge-tier-soon   { background-color: var(--badge-soon); }
        .badge-tier-urgent { background-color: var(--badge-urgent); }

        .btn-delete {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 11px;
            opacity: 0.3;
            transition: opacity 0.2s ease;
            padding: 0 2px;
        }

        .btn-delete:hover {
            opacity: 1;
            color: #e85d75;
        }

        .empty-state {
            text-align: center;
            padding: 10px;
            color: var(--text-muted);
            font-size: 0.8rem;
            background: var(--card-bg);
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-row">
            <h3>UPCOMING FOCUS & DATES</h3>
            <button class="btn-add" onclick="toggleForm()">+ Add</button>
        </div>

        <div class="event-form" id="eventForm">
            <input type="text" id="inputTitle" placeholder="Event title...">
            <input type="date" id="inputDate">
            <button onclick="saveEvent()">Save</button>
        </div>

        <div class="events-list" id="eventsList"></div>
    </div>

    <script>
        let events = JSON.parse(localStorage.getItem('notion_cream_formatted_dates')) || [
            { id: '1', title: 'Project Deadline', date: '2026-10-12' },
            { id: '2', title: 'Flight to Istanbul', date: '2026-10-25' },
            { id: '3', title: 'readingg', date: '2026-09-16' }
        ];

        function saveToStorage() {
            localStorage.setItem('notion_cream_formatted_dates', JSON.stringify(events));
        }

        function toggleForm() {
            const form = document.getElementById('eventForm');
            form.classList.toggle('active');
        }

        function formatDateExact(dateString) {
            if (!dateString) return '';
            const parts = dateString.split('-');
            if (parts.length !== 3) return dateString;
            
            const year = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10) - 1;
            const day = parseInt(parts[2], 10);
            
            const monthNames = [
                "Jan", "Feb", "Mar", "Apr", "May", "Jun",
                "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"
            ];
            
            return `${monthNames[month]} ${day}, ${year}`;
        }

        function getCountdownDetails(dateString) {
            if (!dateString) return { text: '', class: 'badge-tier-future' };
            const today = new Date();
            today.setHours(0,0,0,0);
            const targetDate = new Date(dateString);
            targetDate.setHours(0,0,0,0);
            
            const diffTime = targetDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0) return { text: 'Passed', class: 'badge-tier-future' };
            if (diffDays === 0) return { text: 'Today', class: 'badge-tier-urgent' };
            if (diffDays === 1) return { text: 'Tomorrow', class: 'badge-tier-urgent' };
            if (diffDays <= 3) return { text: `In ${diffDays}d`, class: 'badge-tier-soon' };
            if (diffDays <= 7) return { text: `In ${diffDays}d`, class: 'badge-tier-week' };
            return { text: `In ${diffDays}d`, class: 'badge-tier-future' };
        }

        function renderEvents() {
            const listEl = document.getElementById('eventsList');
            listEl.innerHTML = '';

            if (events.length === 0) {
                listEl.innerHTML = `<div class="empty-state">No upcoming dates. Click "+ Add" to create one.</div>`;
                return;
            }

            events.forEach((ev, index) => {
                const countdown = getCountdownDetails(ev.date);
                const formattedDate = formatDateExact(ev.date);
                
                const card = document.createElement('div');
                card.className = 'event-card';
                card.draggable = true;
                card.dataset.index = index;

                card.innerHTML = `
                    <div class="event-info">
                        <span class="drag-handle">⋮⋮</span>
                        <div class="event-text-group">
                            <input type="text" class="title-input" value="${escapeHtml(ev.title)}" onchange="updateTitle('${ev.id}', this.value)" />
                            <div class="event-date-wrapper">
                                <span class="event-date-display">${formattedDate}</span>
                                <input type="date" class="event-date-picker" value="${ev.date}" onchange="updateDate('${ev.id}', this.value)" />
                            </div>
                        </div>
                    </div>
                    <div class="event-right">
                        <span class="countdown-badge ${countdown.class}">${countdown.text}</span>
                        <button class="btn-delete" onclick="deleteEvent('${ev.id}')" title="Delete">✕</button>
                    </div>
                `;

                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragover', handleDragOver);
                card.addEventListener('drop', handleDrop);
                card.addEventListener('dragend', handleDragEnd);

                listEl.appendChild(card);
            });
        }

        function saveEvent() {
            const titleInput = document.getElementById('inputTitle');
            const dateInput = document.getElementById('inputDate');

            if (!titleInput.value.trim() || !dateInput.value) return;

            events.push({
                id: Date.now().toString(),
                title: titleInput.value.trim(),
                date: dateInput.value
            });

            saveToStorage();
            renderEvents();

            titleInput.value = '';
            dateInput.value = '';
            toggleForm();
        }

        function updateTitle(id, newTitle) {
            const item = events.find(e => e.id === id);
            if (item) {
                item.title = newTitle.trim() || 'Untitled Event';
                saveToStorage();
            }
        }

        function updateDate(id, newDate) {
            const item = events.find(e => e.id === id);
            if (item) {
                item.date = newDate;
                saveToStorage();
                renderEvents();
            }
        }

        function deleteEvent(id) {
            events = events.filter(ev => ev.id !== id);
            saveToStorage();
            renderEvents();
        }

        let draggedIndex = null;

        function handleDragStart(e) {
            draggedIndex = +this.dataset.index;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDrop(e) {
            e.preventDefault();
            const targetIndex = +this.dataset.index;
            if (draggedIndex === null || draggedIndex === targetIndex) return;

            const draggedItem = events.splice(draggedIndex, 1)[0];
            events.splice(targetIndex, 0, draggedItem);

            saveToStorage();
            renderEvents();
        }

        function handleDragEnd() {
            this.classList.remove('dragging');
            draggedIndex = null;
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        renderEvents();
    </script>
</body>
</html>
